{% extends 'store/base.html' %}

{% block content %}
    <div class="checkout-container" style="max-width: 600px; margin: 0 auto;">
        <h2 style="margin-bottom: 20px; font-size: 20px;">Checkout</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            {{ form.as_p }}
            
            <button type="submit" class="checkout-btn" style="margin-top: 20px;">
                Complete Order
            </button>
        </form>
    </div>
{% endblock %}
