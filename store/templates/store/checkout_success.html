{% extends 'store/base.html' %}

{% block content %}
    <div style="text-align: center; padding: 60px 20px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);">
        <h1 style="color: #28a745; margin-bottom: 20px;">Thank you for your order!</h1>
        <p style="font-size: 18px; margin-bottom: 10px;">Your order number is: <strong>#{{ order.id }}</strong></p>
        <p style="color: #777; margin-bottom: 30px;">A confirmation email has been sent to {{ order.email }}.</p>
        
        <a href="/" class="btn" style="width: auto; padding: 12px 25px;">Return to Store</a>
    </div>
{% endblock %}
